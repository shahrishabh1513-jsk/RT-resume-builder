<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume Builder — RT Resume Builder</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%2317233B%22/><text x=%2250%22 y=%2266%22 font-size=%2244%22 fill=%22%23FBF9F4%22 text-anchor=%22middle%22 font-family=%22Georgia,serif%22>RT</text></svg>">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/builder.css">
<link rel="stylesheet" href="css/resume.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/print.css" media="print">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="builder-page">

<header class="builder-header no-print">
  <a href="dashboard.html" class="brand"><span class="brand-mark">RT</span></a>
  <div class="resume-name-wrap">
    <input type="text" id="resume-name-input" class="resume-name-input" value="Untitled Resume">
    <span class="save-status" id="save-status"><span class="dot"></span><span>Saved</span></span>
  </div>
  <div class="builder-header-actions">
    <button class="btn-icon" id="undo-btn" title="Undo (Ctrl+Z)"><span data-icon="undo"></span></button>
    <button class="btn-icon" id="redo-btn" title="Redo (Ctrl+Y)"><span data-icon="redo"></span></button>
    <div class="divider"></div>
    <button class="btn btn-ghost btn-sm" id="check-resume-btn"><span data-icon="check-circle"></span> Check ATS Score</button>
    <button class="btn btn-outline btn-sm" id="print-btn"><span data-icon="print"></span> Print</button>
    <div class="more-menu-wrap">
      <button class="btn btn-primary btn-sm" id="more-menu-btn"><span data-icon="download"></span> Download <span style="margin-left:2px;">▾</span></button>
      <div class="more-menu" id="download-menu">
        <button id="download-pdf"><span data-icon="download"></span> Download PDF</button>
        <button id="download-txt"><span data-icon="download"></span> Download TXT</button>
        <button id="download-json"><span data-icon="download"></span> Export JSON Backup</button>
        <button id="import-json-btn"><span data-icon="folder"></span> Import JSON Backup</button>
      </div>
    </div>
    <div class="more-menu-wrap">
      <button class="btn-icon" id="more-menu-btn-2" title="More"><span data-icon="more"></span></button>
      <div class="more-menu" id="more-menu">
        <button id="action-rename"><span data-icon="edit"></span> Rename</button>
        <button id="action-duplicate"><span data-icon="copy"></span> Duplicate</button>
        <button id="action-reset"><span data-icon="undo"></span> Reset</button>
        <button id="action-print"><span data-icon="print"></span> Print</button>
        <button class="danger" id="action-delete"><span data-icon="trash"></span> Delete</button>
      </div>
    </div>
    <input type="file" id="import-json-input" accept="application/json" class="visually-hidden">
  </div>
</header>

<div class="progress-block no-print">
  <div class="p-top"><span>Resume Completion</span><strong id="progress-pct">0%</strong></div>
  <div class="progress-bar-track"><div class="progress-bar-fill" id="progress-bar-fill" style="width:0%"></div></div>
</div>

<div class="builder-body">
  <aside class="builder-sidebar no-print" id="builder-sidebar">
    <div id="sidebar-sections" class="sidebar-sections"></div>
  </aside>

  <section class="builder-form-panel no-print" id="builder-form-panel">
    <div class="form-panel-inner" id="form-panel-inner"></div>
  </section>

  <section class="builder-preview-panel" id="builder-preview-panel">
    <div class="preview-toolbar no-print">
      <button class="btn-icon" id="zoom-out">–</button>
      <span class="zoom-label" id="zoom-label">62%</span>
      <button class="btn-icon" id="zoom-in">+</button>
      <button class="btn btn-ghost btn-sm" id="zoom-fit">Fit</button>
    </div>
    <div class="preview-scroll">
      <div class="preview-scale-wrap">
        <div id="resume-preview-container"></div>
      </div>
    </div>
  </section>
</div>

<nav class="mobile-tabs no-print">
  <button data-panel="sections" class=""><span data-icon="list"></span>Sections</button>
  <button data-panel="edit" class="active"><span data-icon="edit"></span>Edit</button>
  <button data-panel="preview"><span data-icon="eye"></span>Preview</button>
  <button data-panel="design"><span data-icon="palette"></span>Design</button>
</nav>

<script src="js/ui.js"></script>
<script src="js/storage.js"></script>
<script src="js/resume-data.js"></script>
<script src="js/icons.js"></script>
<script src="js/templates.js"></script>
<script src="js/resume-preview.js"></script>
<script src="js/suggestions-data.js"></script>
<script src="js/sample-data.js"></script>
<script src="js/navigation.js"></script>
<script src="js/pdf-export.js"></script>
<script src="js/resume-builder.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('import-json-btn').addEventListener('click', () => document.getElementById('import-json-input').click());
  document.getElementById('more-menu-btn-2').addEventListener('click', (e) => { e.stopPropagation(); document.getElementById('more-menu').classList.toggle('open'); });
  document.getElementById('more-menu-btn').addEventListener('click', (e) => { e.stopPropagation(); document.getElementById('download-menu').classList.toggle('open'); });
  document.addEventListener('click', () => { document.getElementById('download-menu')?.classList.remove('open'); document.getElementById('more-menu')?.classList.remove('open'); });
  document.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = RTIcons[el.dataset.icon] || ''; });
});
</script>
</body>
</html>
